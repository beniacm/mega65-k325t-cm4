# /etc/systemd/journald.conf.d/m65-volatile.conf (rockchip/deploy/setup_rockchip.sh)
# The journal stays in RAM: no continuous writer on the module's eMMC (flash wear).  For crash
# logs stream it to the PC instead: ssh root@<module> 'journalctl -f -k -o short-precise' > log
[Journal]
Storage=volatile
RuntimeMaxUse=32M
