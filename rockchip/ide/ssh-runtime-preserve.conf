# /etc/systemd/system/ssh@.service.d/m65-preserve.conf
# Debian buster's sshd runs socket-activated, one ssh@.service instance per connection, each
# with RuntimeDirectory=sshd.  When an instance ends, systemd deletes /run/sshd; a connection
# starting at that moment fails ("fatal: Missing privilege separation directory: /run/sshd",
# the client sees "kex_exchange_identification: Connection reset by peer").  With several short
# ssh/scp calls in a row about half of them failed.  Keep the directory.
[Service]
RuntimeDirectoryPreserve=yes
