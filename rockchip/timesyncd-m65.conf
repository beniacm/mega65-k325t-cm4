# /etc/systemd/timesyncd.conf.d/m65.conf (rockchip/deploy/setup_rockchip.sh)
# systemd-timesyncd (>= 250) stamps /var/lib/systemd/timesync/clock every 60 s by default: a
# continuous writer on the module's eMMC (ext4 journal commit each time).  Only the saves at NTP
# synchronisations remain (poll interval 32 s .. 34 min, settling at the long end); the clock still
# starts from the last saved time after a reboot.  (systemd 241 on the Luckfox ignores the key.)
[Time]
SaveIntervalSec=infinity
